<!doctype html>
<html lang="hi" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NodeMG Studio</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0c1018">
  <link rel="icon" href="profile.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // set theme before first paint (no flash)
    try {
      var t = localStorage.getItem('nodemg.theme');
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body class="locked">
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand" id="brand"></div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main-col">
      <header class="topbar">
        <button class="iconbtn only-mobile" id="menuBtn" aria-label="Menu"></button>
        <h1 class="page-title" id="pageTitle"></h1>
        <div class="top-actions">
          <button class="datebtn" id="dateBtn" aria-haspopup="dialog"></button>
          <button class="iconbtn" id="refreshBtn" data-tip-key="refresh" aria-label="Refresh"></button>
          <button class="iconbtn txt" id="langBtn" aria-label="Language"></button>
          <button class="iconbtn" id="themeBtn" aria-label="Theme"></button>
          <button class="iconbtn" id="lockBtn" aria-label="Lock"></button>
        </div>
      </header>

      <div class="daystrip-wrap">
        <div class="daystrip" id="dayStrip" role="listbox" aria-label="Days"></div>
      </div>

      <div id="banner"></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-scrim" id="drawerScrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="datepop" id="datePop" role="dialog" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/vault.js"></script>
  <script src="js/gate.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
